name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        extras: [base, numba]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.extras }}" = "numba" ]; then
            python -m pip install -e ".[numba]"
          else
            python -m pip install -e .
          fi
          python -m pip install pytest
      - name: Run tests
        run: |
          if [ "${{ matrix.extras }}" = "numba" ]; then
            SHALLOWWATER_USE_NUMBA=1 pytest -q
          else
            SHALLOWWATER_USE_NUMBA=0 pytest -q
          fi
      - name: Compile example scripts
        run: |
          python -m compileall -q src/shallowwater scripts
      # Optional: smoke-run a subset of notebooks (avoid long jobs)
